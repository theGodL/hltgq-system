spring.application.name=hltgq-system
server.port=8080

# ===== KingbaseES v8 数据库配置（与其他 hltgq 项目一致） =====
spring.datasource.primary.jdbc-url=jdbc:postgresql://10.68.18.5:54321/qixiao-apaas?currentSchema=qixiao-apaas
spring.datasource.primary.username=SYSTEM
spring.datasource.primary.password=T!3>kGit70DZ
spring.datasource.primary.driver-class-name=org.postgresql.Driver

# ===== MyBatis-Plus =====
mybatis-plus.type-handlers-package=com.qgyun.hltgq.hltgqsystem.handler
mybatis-plus.configuration.map-underscore-to-camel-case=false
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== 日志路径 =====
logging.file.path=/app/logs

# ===== Jackson =====
spring.jackson.serialization.write-bigdecimal-as-plain=true

# ===== Redis cluster（与其他 hltgq 项目一致，10.68.18.9:6382~6384） =====
spring.redis.cluster.nodes=10.68.18.9:6382,10.68.18.9:6383,10.68.18.9:6384
spring.redis.cluster.max-redirects=3
spring.redis.password=${REDIS_PASSWORD:Qixiao@redis20260630.com}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# ===== scheduled task pool =====
spring.task.scheduling.pool.size=2

# ===== 静态资源禁用缓存（避免页面更新后浏览器仍用旧版）=====
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# ===== 登录验证（与 hltgq-site 一致；联调通过后置 true）=====
auth.enabled=true
auth.login-page-url=http://220.179.1.110:8081/login/user/login
# 额外白名单（逗号分隔，前缀匹配）；/auth/login 与 /error 为代码固定白名单
# /login-log/report、/login-log/report-request 为登录事件/请求上报接口（内置 token 校验）
auth.white-list=/login-log/report,/login-log/report-request
# 管理员角色缓存 key 前缀（Redis 未命中时查库兜底）
auth.role-cache-key-prefix=qx.auth.hltgq.

# ===== 系统操作日志（数据库变更扫描）=====
# 监控表清单（分组/表名/是否跟踪删除），配置化，新增表只改该文件
oplog.config-location=classpath:oplog-tables.json
# 扫描总开关（也可在 oplog-tables.json 的 scanEnabled 控制）
oplog.scan.enabled=true
# 启动后一次性初始扫描延迟（毫秒）
oplog.scan.initial-delay-ms=30000
# 周期扫描 cron（增量）
oplog.scan.cron=0 0/5 * * * ?

# ===== 登录日志（自建，Redis 会话采集）=====
loginlog.collect.enabled=true
loginlog.collect.initial-delay-ms=20000
loginlog.collect.delay-ms=120000
loginlog.session-key-prefix=dev_hltgq_session:
# 登录事件与登录请求的时间匹配窗口（秒）
loginlog.match-window-seconds=5
# 上报接口 token（为空则不校验）
loginlog.report.token=
